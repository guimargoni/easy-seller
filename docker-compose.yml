services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: easy_seller
      POSTGRES_PASSWORD: easy_seller
      POSTGRES_DB: easy_seller
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easy_seller"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
volumes:
  postgres_data:
  redis_data:
