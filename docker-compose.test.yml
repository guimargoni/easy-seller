services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: easy_seller_milestone0_test
    ports: ["55433:5432"]
    volumes: ["postgres_test_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d easy_seller_milestone0_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_test_data:

